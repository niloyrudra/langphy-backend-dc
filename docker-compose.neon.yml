  # ── Python / AI Services ──────────────────────────────────────────────────

  nlp:
    build:
      context: ./services/nlp-service
      dockerfile: Dockerfile
      args:
        UID: "1000"
        GID: "1000"
    restart: unless-stopped
    environment:
      PORT: ${NLP_PORT}
      JWT_KEY: ${JWT_KEY}
    networks:
      - langphy
