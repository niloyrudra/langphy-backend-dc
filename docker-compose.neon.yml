# Langphy Backend — Local Development with Neon PostgreSQL
# Uses external Neon databases instead of local postgres container
# Run: docker compose -f docker-compose.neon.yml --env-file .env.local up -d

x-pg: &pg
  # No local PG_HOST/PG_PORT - services use individual *_POSTGRES_DATABASE_URL
  PG_PASSWORD: ${PG_PASSWORD}

x-kafka: &kafka
  KAFKA_BROKER: ${KAFKA_BROKER:-}
  KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
  KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
  KAFKAJS_NO_PARTITIONER_WARNING: "1"

x-jwt: &jwt
  JWT_KEY: ${JWT_KEY}

x-mongo: &mongo
  MONGO_URI: ${MONGO_URI}

services:

  # ── Infrastructure (no postgres) ────────────────────────────────────────────

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: Langphy-DE
    volumes:
      - mongo_data:/data/db
    networks:
      - langphy
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - langphy
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.7.2
    restart: unless-stopped
    # ⚠ Local == Production parity: same single-node KRaft image & env as the
    #   top/live section of docker-compose.yml (no Zookeeper).
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: "${KAFKA_ADVERTISED_LISTENERS:-PLAINTEXT://kafka:9092}"
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 48
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - langphy
    ports:
      - "9092:9092"

  # ── PostgreSQL Services (connect to Neon) ──────────────────────────────────

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: sh -c "node dist/db/migrate.js && node dist/index.js"
    environment:
      <<: [*kafka, *jwt]
      SERVICE_NAME: auth-service
      PG_DB: langphy_auth
      POSTGRES_DATABASE_URL: ${AUTH_POSTGRES_DATABASE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      REDIS_URL: ${REDIS_URL}
      PORT: ${AUTH_PORT}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID}
      GOOGLE_ANDROID_CLIENT_ID: ${GOOGLE_ANDROID_CLIENT_ID}
      GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
    networks:
      - langphy

  streaks:
    build:
      context: .
      dockerfile: services/streaks/Dockerfile
    restart: unless-stopped
    command: sh -c "node dist/db/migrate.js && node dist/index.js"
    environment:
      <<: [*kafka, *jwt]
      SERVICE_NAME: streaks-service
      PG_DB: langphy_streaks
      POSTGRES_DATABASE_URL: ${STREAKS_POSTGRES_DATABASE_URL}
      PORT: ${STREAKS_PORT}
    networks:
      - langphy

  progress:
    build:
      context: .
      dockerfile: services/progress/Dockerfile
    restart: unless-stopped
    command: sh -c "node dist/db/migrate.js && node dist/index.js"
    environment:
      <<: [*kafka, *jwt]
      SERVICE_NAME: progress-service
      PG_DB: langphy_progress
      POSTGRES_DATABASE_URL: ${PROGRESS_POSTGRES_DATABASE_URL}
      PORT: ${PROGRESS_PORT}
    networks:
      - langphy

  performance:
    build:
      context: .
      dockerfile: services/performance/Dockerfile
    restart: unless-stopped
    command: sh -c "node dist/db/migrate.js && node dist/index.js"
    environment:
      <<: [*kafka, *jwt]
      SERVICE_NAME: performance-service
      PG_DB: langphy_performance
      POSTGRES_DATABASE_URL: ${PERFORMANCE_POSTGRES_DATABASE_URL}
      PORT: ${PERFORMANCE_PORT}
    networks:
      - langphy

  profile:
    build:
      context: .
      dockerfile: services/profile/Dockerfile
    restart: unless-stopped
    command: sh -c "node dist/db/migrate.js && node dist/index.js"
    environment:
      <<: [*kafka, *jwt]
      SERVICE_NAME: profile-service
      PG_DB: langphy_profile
      POSTGRES_DATABASE_URL: ${PROFILE_POSTGRES_DATABASE_URL}
      PORT: ${PROFILE_PORT}
    networks:
      - langphy

  settings:
    build:
      context: .
      dockerfile: services/settings/Dockerfile
    restart: unless-stopped
    command: sh -c "node dist/db/migrate.js && node dist/index.js"
    environment:
      <<: [*kafka, *jwt]
      SERVICE_NAME: settings-service
      PG_DB: langphy_settings
      POSTGRES_DATABASE_URL: ${SETTINGS_POSTGRES_DATABASE_URL}
      PORT: ${SETTINGS_PORT}
    networks:
      - langphy

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    restart: unless-stopped
    command: sh -c "node dist/db/migrate.js && node dist/index.js"
    environment:
      <<: [*kafka, *jwt]
      SERVICE_NAME: notification-service
      PG_DB: langphy_notification
      POSTGRES_DATABASE_URL: ${NOTIFICATION_POSTGRES_DATABASE_URL}
      PORT: ${NOTIFICATION_PORT}
    networks:
      - langphy

  gateway:
    build:
      context: .
      dockerfile: services/gateway-service/Dockerfile
    restart: unless-stopped
    command: sh -c "node dist/db/migrate.js && node dist/index.js"
    environment:
      <<: [*kafka, *jwt]
      SERVICE_NAME: gateway-service
      NODE_ENV: development
      PG_DB: langphy_gateway
      POSTGRES_DATABASE_URL: ${GATEWAY_POSTGRES_DATABASE_URL}
      PORT: ${GATEWAY_PORT}
    networks:
      - langphy

  # ── MongoDB Services ───────────────────────────────────────────────────────

  category:
    build:
      context: .
      dockerfile: services/category/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*mongo]
      CATEGORY_MONGO_URI: ${MONGO_URI}
      CATEGORY_COLLECTION: ${CATEGORY_COLLECTION}
      CATEGORY_CONTENT_VERSION: ${CATEGORY_CONTENT_VERSION}
      PORT: ${CATEGORY_PORT}
    networks:
      - langphy

  unit:
    build:
      context: .
      dockerfile: services/unit/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*mongo]
      UNIT_MONGO_URI: ${MONGO_URI}
      UNIT_COLLECTION: ${UNIT_COLLECTION}
      UNIT_CONTENT_VERSION: ${UNIT_CONTENT_VERSION}
      PORT: ${UNIT_PORT}
    networks:
      - langphy

  practice:
    build:
