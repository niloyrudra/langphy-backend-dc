      - langphy

  quiz:
    build:
      context: .
      dockerfile: services/quiz/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*mongo]
      QUIZ_MONGO_URI: ${MONGO_URI}
      QUIZ_COLLECTION: ${QUIZ_COLLECTION}
      QUIZ_CONTENT_VERSION: ${QUIZ_CONTENT_VERSION}
      PORT: ${QUIZ_PORT}
    networks:
      - langphy

  speaking:
    build:
      context: .
      dockerfile: services/speaking/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*mongo]
      SPEAKING_MONGO_URI: ${MONGO_URI}
      SPEAKING_COLLECTION: ${SPEAKING_COLLECTION}
      SPEAKING_CONTENT_VERSION: ${SPEAKING_CONTENT_VERSION}
      PORT: ${SPEAKING_PORT}
    networks:
      - langphy

  reading:
    build:
      context: .
      dockerfile: services/reading/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*mongo]
      READING_MONGO_URI: ${MONGO_URI}
      READING_COLLECTION: ${READING_COLLECTION}
      READING_CONTENT_VERSION: ${READING_CONTENT_VERSION}
      PORT: ${READING_PORT}
    networks:
      - langphy

  writing:
    build:
      context: .
      dockerfile: services/writing/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*mongo]
      WRITING_MONGO_URI: ${MONGO_URI}
      WRITING_COLLECTION: ${WRITING_COLLECTION}
      WRITING_CONTENT_VERSION: ${WRITING_CONTENT_VERSION}
      PORT: ${WRITING_PORT}
    networks:
      - langphy

  listening:
    build:
      context: .
      dockerfile: services/listening/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*mongo]
      LISTENING_MONGO_URI: ${MONGO_URI}
