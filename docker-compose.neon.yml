      NLP_HOST: ${NLP_HOST}
      NLP_PORT: ${NLP_PORT}
      SPEECH_API_HOST: ${SPEECH_API_HOST}
      SPEECH_API_PORT: ${SPEECH_API_PORT}
    networks:
      - langphy

volumes:
  mongo_data:
  redis_data:
  kafka_data:
  audio_tmp:
  whisper_cache:
  caddy_data:
  caddy_config:

networks:
  langphy:
    driver: bridge