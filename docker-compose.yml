# Langphy Backend — Railway Production Docker Compose
# Fixes:
#   1. postgres PGDATA moved to subdirectory (fixes lost+found Railway volume issue)
#   2. caddy uses pre-built image with baked Caddyfile (fixes volume mount issue)
#   3. removed version: "3.9" (obsolete)

x-pg: &pg
  PG_HOST: postgres
  PG_PORT: "5432"
  PG_USER: langphy_admin
  PG_PASSWORD: ${PG_PASSWORD}

x-kafka: &kafka
  KAFKA_BROKER: ${KAFKA_BROKER:-kafka:9092}
  KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME}
  KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD}
  KAFKAJS_NO_PARTITIONER_WARNING: "1"

x-jwt: &jwt
  JWT_KEY: ${JWT_KEY}

services:

  # ── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langphy_admin
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: langphy_auth
      # ✅ Fix: use subdirectory so initdb doesn't see lost+found from Railway volume mount
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langphy_admin -d langphy_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - langphy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Cap Redis memory and prefer evicting keys that already have a TTL
    # (audio blobs, cache, rate-limit counters, job status). RQ queue entries
    # have no TTL, so queued jobs are protected from eviction.
    command: redis-server --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - langphy

  # ── Kafka (KRaft mode - no Zookeeper) ──────────────────────────────────────
  kafka:
    image: apache/kafka:3.7.2
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - langphy

  # ── PostgreSQL services ───────────────────────────────────────────────────

  auth:
    image: niloyrudra/auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: [*pg, *kafka, *jwt]
      SERVICE_NAME: auth-service
      PG_DB: langphy_auth
      POSTGRES_DATABASE_URL: ${AUTH_POSTGRES_DATABASE_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY}
      FROM_EMAIL: ${FROM_EMAIL:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID}
      GOOGLE_ANDROID_CLIENT_ID: ${GOOGLE_ANDROID_CLIENT_ID}
      GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      REDIS_URL: redis://redis:6379
    command: sh -c "node dist/db/migrate.js && node dist/index.js"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/users/db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - langphy

  streaks:
    image: niloyrudra/streaks
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: [*pg, *kafka, *jwt]
      SERVICE_NAME: streaks-service
      PG_DB: langphy_streaks
      POSTGRES_DATABASE_URL: ${STREAKS_POSTGRES_DATABASE_URL:-}
    command: sh -c "node dist/db/migrate.js && node dist/index.js"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - langphy

  progress:
    image: niloyrudra/progress
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: [*pg, *kafka, *jwt]
      SERVICE_NAME: progress-service
      PG_DB: langphy_progress
      POSTGRES_DATABASE_URL: ${PROGRESS_POSTGRES_DATABASE_URL:-}
    command: sh -c "node dist/db/migrate.js && node dist/index.js"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3002/api/progress/db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - langphy

  performance:
    image: niloyrudra/performance
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: [*pg, *kafka, *jwt]
      SERVICE_NAME: performance-service
      PG_DB: langphy_performance
      POSTGRES_DATABASE_URL: ${PERFORMANCE_POSTGRES_DATABASE_URL:-}
    command: sh -c "node dist/db/migrate.js && node dist/index.js"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3003/api/performance/db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - langphy

  profile:
    image: niloyrudra/profile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: [*pg, *kafka, *jwt]
      SERVICE_NAME: profile-service
      PG_DB: langphy_profile
      POSTGRES_DATABASE_URL: ${PROFILE_POSTGRES_DATABASE_URL:-}
    command: sh -c "node dist/db/migrate.js && node dist/index.js"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3004/api/profile/db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - langphy

  settings:
    image: niloyrudra/settings
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: [*pg, *kafka, *jwt]
      SERVICE_NAME: settings-service
      PG_DB: langphy_settings
      POSTGRES_DATABASE_URL: ${SETTINGS_POSTGRES_DATABASE_URL:-}
    command: sh -c "node dist/db/migrate.js && node dist/index.js"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3005/api/settings/db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - langphy

  notification:
    image: niloyrudra/notification
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: [*pg, *kafka, *jwt]
      SERVICE_NAME: notification-service
      PG_DB: langphy_notification
      POSTGRES_DATABASE_URL: ${NOTIFICATION_POSTGRES_DATABASE_URL:-}
    command: sh -c "node dist/db/migrate.js && node dist/index.js"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4011/api/notification/db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - langphy

  gateway:
    image: niloyrudra/gateway-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: [*pg, *kafka, *jwt]
      SERVICE_NAME: gateway-service
      NODE_ENV: production
      PG_DB: langphy_gateway
      POSTGRES_DATABASE_URL: ${GATEWAY_POSTGRES_DATABASE_URL:-}
    command: sh -c "node dist/db/migrate.js && node dist/index.js"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3009/api/gateway/db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - langphy

  # ── MongoDB services ──────────────────────────────────────────────────────

  category:
    image: niloyrudra/category
    restart: unless-stopped
    environment:
      CATEGORY_MONGO_URI: ${MONGO_URI}
      CATEGORY_COLLECTION: ${CATEGORY_COLLECTION:-categories}
      CATEGORY_CONTENT_VERSION: ${CATEGORY_CONTENT_VERSION:-1}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/api/category/version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - langphy

  unit:
    image: niloyrudra/unit
    restart: unless-stopped
    environment:
      UNIT_MONGO_URI: ${MONGO_URI}
      UNIT_COLLECTION: ${UNIT_COLLECTION:-units}
      UNIT_CONTENT_VERSION: ${UNIT_CONTENT_VERSION:-1}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4001/api/unit/version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - langphy

  practice:
    image: niloyrudra/practice
    restart: unless-stopped
    environment:
      PRACTICE_MONGO_URI: ${MONGO_URI}
      PRACTICE_COLLECTION: ${PRACTICE_COLLECTION:-practices}
      PRACTICE_CONTENT_VERSION: ${PRACTICE_CONTENT_VERSION:-1}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4002/api/practices/version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - langphy

  quiz:
    image: niloyrudra/quiz
    restart: unless-stopped
    environment:
      QUIZ_MONGO_URI: ${MONGO_URI}
      QUIZ_COLLECTION: ${QUIZ_COLLECTION:-quizzes}
      QUIZ_CONTENT_VERSION: ${QUIZ_CONTENT_VERSION:-1}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4003/api/quizzes/version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - langphy

  speaking:
    image: niloyrudra/speaking
    restart: unless-stopped
    environment:
      SPEAKING_MONGO_URI: ${MONGO_URI}
      SPEAKING_COLLECTION: ${SPEAKING_COLLECTION:-speakings}
      SPEAKING_CONTENT_VERSION: ${SPEAKING_CONTENT_VERSION:-1}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4004/api/speaking/version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - langphy

  reading:
    image: niloyrudra/reading
    restart: unless-stopped
    environment:
      READING_MONGO_URI: ${MONGO_URI}
      READING_COLLECTION: ${READING_COLLECTION:-readings}
      READING_CONTENT_VERSION: ${READING_CONTENT_VERSION:-1}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4005/api/reading/version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - langphy

  writing:
    image: niloyrudra/writing
    restart: unless-stopped
    environment:
      WRITING_MONGO_URI: ${MONGO_URI}
      WRITING_COLLECTION: ${WRITING_COLLECTION:-writings}
      WRITING_CONTENT_VERSION: ${WRITING_CONTENT_VERSION:-1}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4006/api/writing/version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - langphy

  listening:
    image: niloyrudra/listening
    restart: unless-stopped
    environment:
      LISTENING_MONGO_URI: ${MONGO_URI}
      LISTENING_COLLECTION: ${LISTENING_COLLECTION:-listenings}
      LISTENING_CONTENT_VERSION: ${LISTENING_CONTENT_VERSION:-1}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4007/api/listening/version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - langphy

  # ── Python / AI services ──────────────────────────────────────────────────

  nlp:
    image: niloyrudra/nlp-service
    restart: unless-stopped
    environment:
      JWT_KEY: ${JWT_KEY}
      # Shared service-to-service secret for the speech-worker -> NLP call
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5).read()"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - langphy

  speech-api:
    image: niloyrudra/speech-service
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NLP_SERVICE_URL: http://nlp:8000
      WHISPER_MODEL_SIZE: small
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_NUM_WORKERS: "1"
      HF_HOME: /root/.cache/huggingface
      JWT_KEY: ${JWT_KEY}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    volumes:
      - audio_tmp:/tmp
      - whisper_cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready', timeout=5).read()"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - langphy

  speech-worker:
    image: niloyrudra/speech-service
    restart: unless-stopped
    command: ["python", "app/worker.py"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NLP_SERVICE_URL: http://nlp:8000
      WHISPER_MODEL_SIZE: small
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_NUM_WORKERS: "1"
      HF_HOME: /root/.cache/huggingface
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    volumes:
      - audio_tmp:/tmp
      - whisper_cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; r=redis.Redis(host='redis', port=6379); r.ping()"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - langphy

  # ── Reverse proxy ─────────────────────────────────────────────────────────
  # ✅ Fix: uses pre-built image with Caddyfile baked in
  # No volume mount needed — Caddyfile is inside the image
  # Build: docker build -t niloyrudra/caddy ./infra/caddy
  # Push:  docker push niloyrudra/caddy
  caddy:
    image: niloyrudra/caddy
    restart: unless-stopped
    environment:
      PORT: "80"
      AUTH_HOST: auth
      AUTH_PORT: "3000"
      STREAKS_HOST: streaks
      STREAKS_PORT: "3001"
      PROGRESS_HOST: progress
      PROGRESS_PORT: "3002"
      PERFORMANCE_HOST: performance
      PERFORMANCE_PORT: "3003"
      PROFILE_HOST: profile
      PROFILE_PORT: "3004"
      SETTINGS_HOST: settings
      SETTINGS_PORT: "3005"
      NOTIFICATION_HOST: notification
      NOTIFICATION_PORT: "4011"
      GATEWAY_HOST: gateway
      GATEWAY_PORT: "3009"
      CATEGORY_HOST: category
      CATEGORY_PORT: "4000"
      UNIT_HOST: unit
      UNIT_PORT: "4001"
      PRACTICE_HOST: practice
      PRACTICE_PORT: "4002"
      QUIZ_HOST: quiz
      QUIZ_PORT: "4003"
      SPEAKING_HOST: speaking
      SPEAKING_PORT: "4004"
      READING_HOST: reading
      READING_PORT: "4005"
      WRITING_HOST: writing
      WRITING_PORT: "4006"
      LISTENING_HOST: listening
      LISTENING_PORT: "4007"
      NLP_HOST: nlp
      NLP_PORT: "8000"
      SPEECH_HOST: speech-api
      SPEECH_PORT: "8001"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - langphy

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  audio_tmp:
  whisper_cache:
  caddy_data:
  caddy_config:

networks:
  langphy:
    driver: bridge




