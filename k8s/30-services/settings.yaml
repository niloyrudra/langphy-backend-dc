# ═══════════════════════════════════════════════════════════════════════════
# Langphy — settings service  (PostgreSQL: langphy_settings, Kafka consumer)
# Port 3005
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: settings
  namespace: langphy
spec:
  strategy: Recreate
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langphy-settings
    spec:
      containers:
        - name: settings
          image: niloyrudra/settings:latest
          command: ["sh", "-c", "node dist/db/migrate.js && node dist/index.js"]
          restartPolicy: always
          terminationGracePeriodSeconds: 30
          resources:
            limits:
              memory: 1Gi
            reservations:
              memory: 512Mi
          ports:
            - containerPort: 3005
          envFrom:
            - configMapRef:
                name: langphy-config
            - secretRef:
                name: langphy-secrets
          env:
            - name: SERVICE_NAME
              value: settings-service
            - name: PG_DB
              value: langphy_settings
            - name: PORT
              value: "3005"
            - name: POSTGRES_DATABASE_URL
              valueFrom:
                secretRef:
                  name: langphy-secrets
                  key: SETTINGS_POSTGRES_DATABASE_URL
          startupProbe:
            httpGet:
              path: /api/settings/db
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/settings/db
              port: 3005
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: settings
  namespace: langphy
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: langphy-settings
  ports:
    - protocol: TCP
      port: 3005