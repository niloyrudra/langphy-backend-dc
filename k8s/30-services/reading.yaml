# ═══════════════════════════════════════════════════════════════════════════
# Langphy — reading content service  (MongoDB Atlas, read-only GET)
# Port 4005
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reading
  namespace: langphy
spec:
  strategy: Recreate
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langphy-reading
    spec:
      containers:
        - name: reading
          image: niloyrudra/reading:latest
          restartPolicy: always
          resources:
            limits:
              memory: 512Mi
            reservations:
              memory: 256Mi
          ports:
            - containerPort: 4005
          envFrom:
            - configMapRef:
                name: langphy-config
            - secretRef:
                name: langphy-secrets
          env:
            - name: PORT
              value: "4005"
            - name: READING_MONGO_URI
              valueFrom:
                secretRef:
                  name: langphy-secrets
                  key: MONGO_URI
            - name: READING_COLLECTION
              value: readings
            - name: READING_CONTENT_VERSION
              value: "1"
          startupProbe:
            httpGet:
              path: /api/reading/version
              port: 4005
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/reading/version
              port: 4005
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: reading
  namespace: langphy
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: langphy-reading
  ports:
    - protocol: TCP
      port: 4005