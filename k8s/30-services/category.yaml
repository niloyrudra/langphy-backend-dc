# ═══════════════════════════════════════════════════════════════════════════
# Langphy — category content service  (MongoDB Atlas, read-only GET)
# Port 4000 · the reference implementation for content versioning
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: category
  namespace: langphy
spec:
  strategy: Recreate
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langphy-category
    spec:
      containers:
        - name: category
          image: niloyrudra/category:latest
          restartPolicy: always
          resources:
            limits:
              memory: 512Mi
            reservations:
              memory: 256Mi
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: langphy-config
            - secretRef:
                name: langphy-secrets
          env:
            - name: PORT
              value: "4000"
            - name: CATEGORY_MONGO_URI
              valueFrom:
                secretRef:
                  name: langphy-secrets
                  key: MONGO_URI
            - name: CATEGORY_COLLECTION
              value: categories
            - name: CATEGORY_CONTENT_VERSION
              value: "1"
          startupProbe:
            httpGet:
              path: /api/category/version
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/category/version
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: category
  namespace: langphy
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: langphy-category
  ports:
    - protocol: TCP
      port: 4000