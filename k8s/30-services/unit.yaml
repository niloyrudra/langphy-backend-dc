# ═══════════════════════════════════════════════════════════════════════════
# Langphy — unit content service  (MongoDB Atlas, read-only GET)
# Port 4001
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unit
  namespace: langphy
spec:
  strategy: Recreate
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langphy-unit
    spec:
      containers:
        - name: unit
          image: niloyrudra/unit:latest
          restartPolicy: always
          resources:
            limits:
              memory: 512Mi
            reservations:
              memory: 256Mi
          ports:
            - containerPort: 4001
          envFrom:
            - configMapRef:
                name: langphy-config
            - secretRef:
                name: langphy-secrets
          env:
            - name: PORT
              value: "4001"
            - name: UNIT_MONGO_URI
              valueFrom:
                secretRef:
                  name: langphy-secrets
                  key: MONGO_URI
            - name: UNIT_COLLECTION
              value: units
            - name: UNIT_CONTENT_VERSION
              value: "1"
          startupProbe:
            httpGet:
              path: /api/unit/version
              port: 4001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/unit/version
              port: 4001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: unit
  namespace: langphy
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: langphy-unit
  ports:
    - protocol: TCP
      port: 4001