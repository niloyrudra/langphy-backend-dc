# ═══════════════════════════════════════════════════════════════════════════
# Langphy — quiz content service  (MongoDB Atlas, read-only GET)
# Port 4003 · public path /api/quizzes/*
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz
  namespace: langphy
spec:
  strategy: Recreate
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langphy-quiz
    spec:
      containers:
        - name: quiz
          image: niloyrudra/quiz:latest
          restartPolicy: always
          resources:
            limits:
              memory: 512Mi
            reservations:
              memory: 256Mi
          ports:
            - containerPort: 4003
          envFrom:
            - configMapRef:
                name: langphy-config
            - secretRef:
                name: langphy-secrets
          env:
            - name: PORT
              value: "4003"
            - name: QUIZ_MONGO_URI
              valueFrom:
                secretRef:
                  name: langphy-secrets
                  key: MONGO_URI
            - name: QUIZ_COLLECTION
              value: quizzes
            - name: QUIZ_CONTENT_VERSION
              value: "1"
          startupProbe:
            httpGet:
              path: /api/quizzes/version
              port: 4003
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/quizzes/version
              port: 4003
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: quiz
  namespace: langphy
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: langphy-quiz
  ports:
    - protocol: TCP
      port: 4003