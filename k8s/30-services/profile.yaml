# ═══════════════════════════════════════════════════════════════════════════
# Langphy — profile service  (PostgreSQL: langphy_profile, Kafka consumer)
# Port 3004
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile
  namespace: langphy
spec:
  strategy: Recreate
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langphy-profile
    spec:
      containers:
        - name: profile
          image: niloyrudra/profile:latest
          command: ["sh", "-c", "node dist/db/migrate.js && node dist/index.js"]
          restartPolicy: always
          terminationGracePeriodSeconds: 30
          resources:
            limits:
              memory: 1Gi
            reservations:
              memory: 512Mi
          ports:
            - containerPort: 3004
          envFrom:
            - configMapRef:
                name: langphy-config
            - secretRef:
                name: langphy-secrets
          env:
            - name: SERVICE_NAME
              value: profile-service
            - name: PG_DB
              value: langphy_profile
            - name: PORT
              value: "3004"
            - name: POSTGRES_DATABASE_URL
              valueFrom:
                secretRef:
                  name: langphy-secrets
                  key: PROFILE_POSTGRES_DATABASE_URL
          startupProbe:
            httpGet:
              path: /api/profile/db
              port: 3004
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/profile/db
              port: 3004
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: profile
  namespace: langphy
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: langphy-profile
  ports:
    - protocol: TCP
      port: 3004