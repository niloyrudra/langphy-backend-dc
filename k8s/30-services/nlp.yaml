# ═══════════════════════════════════════════════════════════════════════════
# Langphy — nlp-service  (Python/FastAPI/spaCy, stateless)
# Port 8000 · requires JWT_KEY + INTERNAL_SERVICE_TOKEN (from Secrets)
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nlp
  namespace: langphy
spec:
  strategy: Recreate
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langphy-nlp
    spec:
      containers:
        - name: nlp
          image: niloyrudra/nlp-service:latest
          restartPolicy: always
          resources:
            limits:
              memory: 2Gi
            reservations:
              memory: 1Gi
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: langphy-config
            - secretRef:
                name: langphy-secrets
          env:
            - name: PORT
              value: "8000"
          startupProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nlp
  namespace: langphy
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: langphy-nlp
  ports:
    - protocol: TCP
      port: 8000