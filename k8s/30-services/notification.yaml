# ═══════════════════════════════════════════════════════════════════════════
# Langphy — notification service  (PostgreSQL: langphy_notification, Kafka)
# Port 4011
# ⚠ Contains an in-process hourly cron (daily-reminder.job.ts). Keep
#   replicas=1 so reminders are not sent once per replica.
# ⚠ This service has NO SIGTERM drain (Kafka consumer uses manual commit +
#   event_id idempotency), so a pod kill is at-least-once safe.
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: langphy
spec:
  strategy: Recreate
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langphy-notification
    spec:
      containers:
        - name: notification
          image: niloyrudra/notification:latest
          command: ["sh", "-c", "node dist/db/migrate.js && node dist/index.js"]
          restartPolicy: always
          resources:
            limits:
              memory: 1Gi
            reservations:
              memory: 512Mi
          ports:
            - containerPort: 4011
          envFrom:
            - configMapRef:
                name: langphy-config
            - secretRef:
                name: langphy-secrets
          env:
            - name: SERVICE_NAME
              value: notification-service
            - name: PG_DB
              value: langphy_notification
            - name: PORT
              value: "4011"
            - name: POSTGRES_DATABASE_URL
              valueFrom:
                secretRef:
                  name: langphy-secrets
                  key: NOTIFICATION_POSTGRES_DATABASE_URL
          startupProbe:
            httpGet:
              path: /api/notification/db
              port: 4011
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/notification/db
              port: 4011
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notification
  namespace: langphy
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: langphy-notification
  ports:
    - protocol: TCP
      port: 4011