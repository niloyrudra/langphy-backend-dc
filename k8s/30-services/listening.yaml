# ═══════════════════════════════════════════════════════════════════════════
# Langphy — listening content service  (MongoDB Atlas, read-only GET)
# Port 4007
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: listening
  namespace: langphy
spec:
  strategy: Recreate
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langphy-listening
    spec:
      containers:
        - name: listening
          image: niloyrudra/listening:latest
          restartPolicy: always
          resources:
            limits:
              memory: 512Mi
            reservations:
              memory: 256Mi
          ports:
            - containerPort: 4007
          envFrom:
            - configMapRef:
                name: langphy-config
            - secretRef:
                name: langphy-secrets
          env:
            - name: PORT
              value: "4007"
            - name: LISTENING_MONGO_URI
              valueFrom:
                secretRef:
                  name: langphy-secrets
                  key: MONGO_URI
            - name: LISTENING_COLLECTION
              value: listenings
            - name: LISTENING_CONTENT_VERSION
              value: "1"
          startupProbe:
            httpGet:
              path: /api/listening/version
              port: 4007
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/listening/version
              port: 4007
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: listening
  namespace: langphy
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: langphy-listening
  ports:
    - protocol: TCP
      port: 4007