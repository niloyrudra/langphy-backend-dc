# ═══════════════════════════════════════════════════════════════════════════
# Langphy — speaking content service  (MongoDB Atlas, read-only GET)
# Port 4004
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speaking
  namespace: langphy
spec:
  strategy: Recreate
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langphy-speaking
    spec:
      containers:
        - name: speaking
          image: niloyrudra/speaking:latest
          restartPolicy: always
          resources:
            limits:
              memory: 512Mi
            reservations:
              memory: 256Mi
          ports:
            - containerPort: 4004
          envFrom:
            - configMapRef:
                name: langphy-config
            - secretRef:
                name: langphy-secrets
          env:
            - name: PORT
              value: "4004"
            - name: SPEAKING_MONGO_URI
              valueFrom:
                secretRef:
                  name: langphy-secrets
                  key: MONGO_URI
            - name: SPEAKING_COLLECTION
              value: speakings
            - name: SPEAKING_CONTENT_VERSION
              value: "1"
          startupProbe:
            httpGet:
              path: /api/speaking/version
              port: 4004
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/speaking/version
              port: 4004
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: speaking
  namespace: langphy
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: langphy-speaking
  ports:
    - protocol: TCP
      port: 4004