# ═══════════════════════════════════════════════════════════════════════════
# Langphy — progress service  (PostgreSQL: langphy_progress, Kafka consumer)
# Port 3002 · serves /api/progress/* and /api/vocabulary/* via Caddy
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: progress
  namespace: langphy
spec:
  strategy: Recreate
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langphy-progress
    spec:
      containers:
        - name: progress
          image: niloyrudra/progress:latest
          command: ["sh", "-c", "node dist/db/migrate.js && node dist/index.js"]
          restartPolicy: always
          terminationGracePeriodSeconds: 30
          resources:
            limits:
              memory: 1Gi
            reservations:
              memory: 512Mi
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: langphy-config
            - secretRef:
                name: langphy-secrets
          env:
            - name: SERVICE_NAME
              value: progress-service
            - name: PG_DB
              value: langphy_progress
            - name: PORT
              value: "3002"
            - name: POSTGRES_DATABASE_URL
              valueFrom:
                secretRef:
                  name: langphy-secrets
                  key: PROGRESS_POSTGRES_DATABASE_URL
          startupProbe:
            httpGet:
              path: /api/progress/db
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/progress/db
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: progress
  namespace: langphy
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: langphy-progress
  ports:
    - protocol: TCP
      port: 3002