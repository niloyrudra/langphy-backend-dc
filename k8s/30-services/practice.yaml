# ═══════════════════════════════════════════════════════════════════════════
# Langphy — practice content service  (MongoDB Atlas, read-only GET)
# Port 4002 · public path /api/practices/*
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: practice
  namespace: langphy
spec:
  strategy: Recreate
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langphy-practice
    spec:
      containers:
        - name: practice
          image: niloyrudra/practice:latest
          restartPolicy: always
          resources:
            limits:
              memory: 512Mi
            reservations:
              memory: 256Mi
          ports:
            - containerPort: 4002
          envFrom:
            - configMapRef:
                name: langphy-config
            - secretRef:
                name: langphy-secrets
          env:
            - name: PORT
              value: "4002"
            - name: PRACTICE_MONGO_URI
              valueFrom:
                secretRef:
                  name: langphy-secrets
                  key: MONGO_URI
            - name: PRACTICE_COLLECTION
              value: practices
            - name: PRACTICE_CONTENT_VERSION
              value: "1"
          startupProbe:
            httpGet:
              path: /api/practices/version
              port: 4002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/practices/version
              port: 4002
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: practice
  namespace: langphy
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: langphy-practice
  ports:
    - protocol: TCP
      port: 4002