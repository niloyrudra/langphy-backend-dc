# ═══════════════════════════════════════════════════════════════════════════
# Langphy — writing content service  (MongoDB Atlas, read-only GET)
# Port 4006
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: writing
  namespace: langphy
spec:
  strategy: Recreate
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langphy-writing
    spec:
      containers:
        - name: writing
          image: niloyrudra/writing:latest
          restartPolicy: always
          resources:
            limits:
              memory: 512Mi
            reservations:
              memory: 256Mi
          ports:
            - containerPort: 4006
          envFrom:
            - configMapRef:
                name: langphy-config
            - secretRef:
                name: langphy-secrets
          env:
            - name: PORT
              value: "4006"
            - name: WRITING_MONGO_URI
              valueFrom:
                secretRef:
                  name: langphy-secrets
                  key: MONGO_URI
            - name: WRITING_COLLECTION
              value: writings
            - name: WRITING_CONTENT_VERSION
              value: "1"
          startupProbe:
            httpGet:
              path: /api/writing/version
              port: 4006
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/writing/version
              port: 4006
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: writing
  namespace: langphy
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: langphy-writing
  ports:
    - protocol: TCP
      port: 4006