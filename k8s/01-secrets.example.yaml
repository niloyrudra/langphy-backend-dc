# ═══════════════════════════════════════════════════════════════════════════
# Langphy — Kubernetes SECRETS  (TEMPLATE — contains NO real values)
# ═══════════════════════════════════════════════════════════════════════════
# USAGE
#   1. cp k8s/01-secrets.example.yaml k8s/01-secrets.yaml     ← gitignored
#   2. Fill in real values (the SAME values your Railway dashboard / .env uses)
#   3. kubectl apply -f k8s/01-secrets.yaml
#   4. Delete k8s/01-secrets.yaml (values now live only in the cluster)
#
# Every service container pulls this Secret via  envFrom: - secretRef
# Specific per-service credentials (e.g. AUTH_POSTGRES_DATABASE_URL) are
# additionally referenced by key in each service manifest.
#
# NEVER commit real values. The repo .gitignore already rejects **/*secrets*.yaml.
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: langphy-secrets
  namespace: langphy
type: Opaque
stringData:
  # ── Auth / JWT ────────────────────────────────────────────────────────
  # MUST be exactly 64 lowercase hex chars — the auth service validates
  # this at boot and refuses to start otherwise.
  #   generate: node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
  JWT_KEY: "REPLACE_WITH_64_HEX_CHARS"

  # Shared service-to-service secret used by speech-worker → nlp (X-Internal-Token).
  # If empty/absent the NLP fallback requires a user JWT the worker cannot
  # provide — speech evaluation would fail. Set a long random string.
  INTERNAL_SERVICE_TOKEN: "REPLACE_WITH_LONG_RANDOM_STRING"

  # ── PostgreSQL (Neon) — one connection URL per PG-backed service ──────
  # The services read the env var POSTGRES_DATABASE_URL; each manifest maps
  # its own <SVC>_POSTGRES_DATABASE_URL key below onto it (same as compose).
  AUTH_POSTGRES_DATABASE_URL:      "postgresql://user:pass@host:5432/langphy_auth?sslmode=require"
  STREAKS_POSTGRES_DATABASE_URL:   "postgresql://user:pass@host:5432/langphy_streaks?sslmode=require"
  PROGRESS_POSTGRES_DATABASE_URL:  "postgresql://user:pass@host:5432/langphy_progress?sslmode=require"
  PERFORMANCE_POSTGRES_DATABASE_URL: "postgresql://user:pass@host:5432/langphy_performance?sslmode=require"
  PROFILE_POSTGRES_DATABASE_URL:   "postgresql://user:pass@host:5432/langphy_profile?sslmode=require"
  SETTINGS_POSTGRES_DATABASE_URL:  "postgresql://user:pass@host:5432/langphy_settings?sslmode=require"
  NOTIFICATION_POSTGRES_DATABASE_URL: "postgresql://user:pass@host:5432/langphy_notification?sslmode=require"
  GATEWAY_POSTGRES_DATABASE_URL:   "postgresql://user:pass@host:5432/langphy_gateway?sslmode=require"

  # Legacy PG fallback (only consulted when the URL above is unset):
  PG_PASSWORD: "REPLACE_WITH_PG_PASSWORD"

  # ── Kafka (MANAGED broker — Upstash / Confluent / Aiven) ──────────────
  # Used verbatim as KAFKA_BROKER / KAFKA_SASL_USERNAME / KAFKA_SASL_PASSWORD.
  # ⚠ The shared kafka.client.ts uses SASL mechanism "plain" — pick a
  #   provider compatible with PLAIN over TLS (Confluent does; verify Upstash).
  # For the OPTIONAL in-cluster KRaft broker instead (see 10-infra/
  # kafka-kraft.example.yaml) set KAFKA_BROKER=kafka:9092 and leave the
  # SASL username/password EMPTY.
  KAFKA_BROKER: "your-cluster-xxxx.upstash.io:9092"
  KAFKA_SASL_USERNAME: "REPLACE_WITH_KAFKA_USERNAME"
  KAFKA_SASL_PASSWORD: "REPLACE_WITH_KAFKA_PASSWORD"

  # ── MongoDB Atlas — single URI, mapped per service in the manifests ───
  MONGO_URI: "mongodb+srv://user:pass@cluster0.xxxxx.mongodb.net/Langphy-DE?retryWrites=true&w=majority"

  # ── Auth service providers / email ─────────────────────────────────────
  RESEND_API_KEY: "REPLACE_WITH_RESEND_API_KEY"
  FROM_EMAIL: "Langphy <no-reply@langphy.com>"
  GOOGLE_WEB_CLIENT_ID: "REPLACE_WITH_GOOGLE_WEB_CLIENT_ID"
  GOOGLE_ANDROID_CLIENT_ID: "REPLACE_WITH_GOOGLE_ANDROID_CLIENT_ID"
  GOOGLE_IOS_CLIENT_ID: "REPLACE_WITH_GOOGLE_IOS_CLIENT_ID"
  FACEBOOK_APP_ID: "REPLACE_WITH_FACEBOOK_APP_ID"
  FACEBOOK_APP_SECRET: "REPLACE_WITH_FACEBOOK_APP_SECRET"

  # ── Optional ───────────────────────────────────────────────────────────
  # HF_TOKEN is only needed if you later bake a gated Hugging Face model
  # (the current "small" Whisper model is public, baked at image build).
  HF_TOKEN: ""