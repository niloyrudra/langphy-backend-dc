# ═══════════════════════════════════════════════════════════════════════════
# Langphy — OPTIONAL in-cluster Kafka (single-node KRaft)
# ═══════════════════════════════════════════════════════════════════════════
# ⚠ THIS IS THE FALLBACK, NOT THE RECOMMENDATION.
# The recommended setup uses a MANAGED Kafka (Upstash/Confluent/Aiven) — see
# the guide §11 "managed vs self-hosted". Self-hosting Kafka means YOU own
# log retention, compaction, PVC growth and upgrades (the same monitoring
# pain you had with Postgres).
#
# If you still want it: this mirrors the compose `kafka` service 1:1.
#   HOW TO ENABLE
#   1. cp k8s/10-infra/kafka-kraft.example.yaml k8s/10-infra/kafka.yaml
#   2. rm k8s/10-infra/kafka-kraft.example.yaml   (apply.sh applies that dir)
#   3. In 01-secrets.yaml set:  KAFKA_BROKER: "kafka:9092"  and leave
#      KAFKA_SASL_USERNAME / KAFKA_SASL_PASSWORD EMPTY (plain TCP, like compose).
#   4. kubectl apply -f k8s/10-infra/kafka.yaml  BEFORE the services.
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: langphy
spec:
  strategy: Recreate
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langphy-kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.7.2
          # NO command override — the apache/kafka image's own entrypoint
          # (bash /etc/kafka/docker/run) reads the KAFKA_* env vars below,
          # exactly like docker-compose.yml does.
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "168"
            - name: KAFKA_LOG_SEGMENT_BYTES
              value: "1073741824"
          restartPolicy: always
          resources:
            limits:
              memory: 1Gi
          ports:
            - containerPort: 9092
          startupProbe:
            exec:
              command:
                - "/opt/kafka/bin/kafka-broker-api-versions.sh"
                - "--bootstrap-server"
                - "localhost:9092"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - "/opt/kafka/bin/kafka-broker-api-versions.sh"
                - "--bootstrap-server"
                - "localhost:9092"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          volumes:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
              persistentVolume:
                PVC: {}
      volumeClaimTemplates:
        - name: kafka-data
          spec:
            storage: 10Gi
            storageClassName: standard
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: langphy
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: langphy-kafka
  ports:
    - protocol: TCP
      port: 9092